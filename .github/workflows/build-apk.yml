name: Build Life Blackbox v2.4.5

on:
  push:
    branches: [main, master, "feature/v2.4.5-maintenance"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check JavaScript
        run: |
          npm run check
          npm test
          npm run test:timeline
          npm run test:publication

      - name: Install pinned Capacitor dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Use existing signing certificate
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compile, lint and build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug signingReport --no-daemon --stacktrace

      - name: Render UI previews
        run: |
          if command -v google-chrome >/dev/null; then
            timeout 60s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update -qq && timeout 60s sudo apt-get install -y fonts-nanum >/dev/null || echo "Korean font installation unavailable"
            node tests/render-preview.mjs
          else echo "Chrome unavailable; UI preview skipped"; fi

      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LifeRecorder-v2.4.5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LifeRecorder-v2.4.5-APK
          path: LifeRecorder-v2.4.5.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeRecorder-v2-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore


  audio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android integration project
        run: |
          npm install
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
          chmod +x android/gradlew
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Real AAC merge, decode and frozen share on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.disposableEmulator=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeRecorder-audio-integration-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
