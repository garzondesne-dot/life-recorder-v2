name: Build Life Blackbox v2.4.1

on:
  push:
    branches: [main, master, "hotfix/v2.4.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check JavaScript
        run: |
          npm run check
          npm test
          npm run test:timeline
          npm run test:publication

      - name: Install pinned Capacitor dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Use existing signing certificate
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compile, lint and build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug signingReport --no-daemon --stacktrace

      - name: Render UI previews
        run: |
          if command -v google-chrome >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y fonts-nanum >/dev/null || echo "Korean font installation unavailable"
            node tests/render-preview.mjs
          else echo "Chrome unavailable; UI preview skipped"; fi

      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LifeRecorder-v2.4.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LifeRecorder-v2.4.1-APK
          path: LifeRecorder-v2.4.1.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeRecorder-v2-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

